name: saga-whisper
services:
  whisper:
    build:
      context: .
    container_name: saga-whisper-dev
    profiles: ["dev"]
    ports:
      - "8100:8100"
    volumes:
      # Model weights are downloaded on first use — persist them so a
      # container recreate doesn't re-download every time.
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model-cache:
