services:
  scanner:
    build: .
    container_name: saga-grocery-scanner
    restart: unless-stopped
    ports:
      - "8200:8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SAGA_API_URL: http://host.docker.internal:3000
      OLLAMA_URL: http://host.docker.internal:11434
      VISION_MODEL: qwen3-vl:4b
      POSTAL_CODE: "27615"
