name: saga-web
services:
  web:
    build:
      context: .
      target: dev
    container_name: saga-web-dev
    profiles: ["dev"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host 80 (plain http://saga, no port) -> Vite still listens on 5180
      # inside the container; only the external mapping changed.
      - "80:5180"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./public:/app/public
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
